<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <title>品质色板（1-6 品）</title>
  <g font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#d4b878"/>
    <text x="25" y="32" fill="#5d3a26">1品</text>
    <rect x="55" y="0" width="50" height="50" rx="8" fill="#aed581"/>
    <text x="80" y="32" fill="#1b5e20">2品</text>
    <rect x="110" y="0" width="50" height="50" rx="8" fill="#90caf9"/>
    <text x="135" y="32" fill="#0d47a1">3品</text>
    <rect x="165" y="0" width="50" height="50" rx="8" fill="#ce93d8"/>
    <text x="190" y="32" fill="#4a148c">4品</text>
    <rect x="220" y="0" width="50" height="50" rx="8" fill="#ffb74d"/>
    <text x="245" y="32" fill="#bf360c">5品</text>
    <rect x="275" y="0" width="50" height="50" rx="8" fill="#ef5350"/>
