<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>稻草人</title>
  <!-- 头 -->
  <circle cx="50" cy="20" r="10" fill="#ffeb3b"/>
  <!-- 帽檐 -->
  <ellipse cx="50" cy="13" rx="14" ry="3" fill="#5d4037"/>
  <!-- 帽顶 -->
  <rect x="42" y="3" width="16" height="10" fill="#5d4037" rx="1"/>
  <!-- 身体 -->
  <rect x="38" y="30" width="24" height="32" fill="#ff9800" rx="2"/>
  <!-- 横木 -->
  <rect x="20" y="42" width="60" height="6" fill="#6d4c41"/>
  <!-- 衣服纹理 -->
  <line x1="50" y1="30" x2="50" y2="62" stroke="#bf360c" stroke-width="1" opacity="0.5"/>
  <!-- 木桩 -->
  <rect x="48" y="62" width="4" height="36" fill="#6d4c41"/>
</svg>