  <g stroke="#5d8a3f" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M 20 30 L 20 40 M 22 30 L 24 38"/>
    <path d="M 40 25 L 40 36 M 42 25 L 44 34"/>
    <path d="M 60 28 L 60 38 M 62 28 L 64 36"/>
    <path d="M 80 30 L 80 40 M 78 30 L 76 38"/>
    <path d="M 30 55 L 30 65 M 32 55 L 34 63"/>
    <path d="M 70 60 L 70 70 M 68 60 L 66 68"/>
  </g>
  <!-- 小花点缀 -->
  <circle cx="25" cy="70" r="2" fill="#ffeb3b"/>
  <circle cx="75" cy="50" r="2" fill="#fff"/>
  <circle cx="55" cy="75" r="2" fill="#ff8a80"/>
</svg>