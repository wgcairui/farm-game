<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>草地块·手绘风</title>
  <defs>
  <linearGradient id="grassPG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9bd061"/>
    <stop offset="100%" stop-color="#7ba85b"/>
  </linearGradient>
  </defs>
  <!-- 投影 -->
  <ellipse cx="50" cy="95" rx="40" ry="3" fill="#000" opacity="0.15"/>
