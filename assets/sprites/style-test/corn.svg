<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>玉米·手绘风</title>
  <defs>
  <linearGradient id="cornG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffeb3b"/>
    <stop offset="100%" stop-color="#f57f17"/>
  </linearGradient>

  <linearGradient id="hullG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff176"/>
    <stop offset="100%" stop-color="#f9a825"/>
  </linearGradient>

  <linearGradient id="leafG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a5d6a7"/>
    <stop offset="100%" stop-color="#388e3c"/>
  </linearGradient>
  </defs>
  <ellipse cx="50" cy="92" rx="14" ry="3" fill="#000" opacity="0.2"/>
  <!-- 外壳（半透） -->
  <path d="M 25 30 Q 22 60 35 85 L 50 88 L 65 85 Q 78 60 75 30 Z"
        fill="url(#hullG)" stroke="#f57f17" stroke-width="1.5" opacity="0.85"/>
  <!-- 玉米粒（点阵） -->
  <g fill="url(#cornG)" stroke="#f57f17" stroke-width="0.8">
    <ellipse cx="38" cy="42" rx="3" ry="4"/>
    <ellipse cx="46" cy="40" rx="3" ry="4"/>
    <ellipse cx="54" cy="40" rx="3" ry="4"/>
    <ellipse cx="62" cy="42" rx="3" ry="4"/>
    <ellipse cx="42" cy="52" rx="3" ry="4"/>
    <ellipse cx="50" cy="50" rx="3" ry="4"/>
    <ellipse cx="58" cy="52" rx="3" ry="4"/>
    <ellipse cx="46" cy="62" rx="3" ry="4"/>
    <ellipse cx="54" cy="62" rx="3" ry="4"/>
    <ellipse cx="50" cy="74" rx="3" ry="4"/>
  </g>
  <!-- 顶部叶 -->
  <ellipse cx="35" cy="20" rx="10" ry="5" fill="url(#leafG)" transform="rotate(-30 35 20)"/>
  <ellipse cx="65" cy="20" rx="10" ry="5" fill="url(#leafG)" transform="rotate(30 65 20)"/>
  <!-- 高光 -->
  <ellipse cx="46" cy="50" rx="2" ry="3" fill="#ffffff" opacity="0.6"/>
</svg>