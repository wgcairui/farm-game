<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <title>池塘·手绘风</title>
  <defs>
  <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#90caf9"/>
    <stop offset="100%" stop-color="#1565c0"/>
  </linearGradient>

  <linearGradient id="lilyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a5d6a7"/>
    <stop offset="100%" stop-color="#388e3c"/>
  </linearGradient>
  </defs>
  <!-- 投影 -->
  <ellipse cx="120" cy="148" rx="110" ry="6" fill="#000" opacity="0.15"/>
  <!-- 池塘主体（不规则椭圆） -->
  <path d="M 30 80 Q 25 50 60 30 Q 120 18 180 32 Q 220 50 210 90 Q 200 130 120 138 Q 40 132 30 80 Z"
        fill="url(#waterG)" stroke="#5d4037" stroke-width="3"/>
  <!-- 水波 -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 50 60 Q 70 55 90 60"/>
    <path d="M 100 75 Q 130 70 160 75"/>
    <path d="M 140 100 Q 170 95 200 100"/>
    <path d="M 60 110 Q 90 105 120 110"/>
  </g>
  <!-- 高光 -->
  <ellipse cx="80" cy="50" rx="20" ry="4" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="160" cy="45" rx="15" ry="3" fill="#ffffff" opacity="0.4"/>

  <!-- 荷叶 1 -->
  <ellipse cx="60" cy="65" rx="20" ry="6" fill="url(#lilyG)" stroke="#388e3c" stroke-width="1.5"/>
  <path d="M 60 65 L 60 60" stroke="#388e3c" stroke-width="1"/>
  <!-- 莲花 -->
  <circle cx="62" cy="55" r="4" fill="#ffcdd2"/>
  <circle cx="62" cy="55" r="2" fill="#ffffff"/>

  <!-- 荷叶 2 -->
  <ellipse cx="180" cy="95" rx="22" ry="7" fill="url(#lilyG)" stroke="#388e3c" stroke-width="1.5"/>
  <!-- 莲花 -->
  <circle cx="178" cy="88" r="5" fill="#f06292"/>
  <circle cx="178" cy="88" r="2.5" fill="#ffeb3b"/>
</svg>