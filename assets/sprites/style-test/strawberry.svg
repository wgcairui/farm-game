<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>草莓·手绘风</title>
  <defs>
  <linearGradient id="strawG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ec407a"/>
    <stop offset="100%" stop-color="#880e4f"/>
  </linearGradient>

  <linearGradient id="leafG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a5d6a7"/>
    <stop offset="100%" stop-color="#388e3c"/>
  </linearGradient>
  </defs>
  <ellipse cx="50" cy="92" rx="16" ry="3" fill="#000" opacity="0.2"/>
  <!-- 草莓心形 -->
  <path d="M 50 25 Q 35 25 28 42 Q 22 58 30 72 Q 38 85 50 88 Q 62 85 70 72 Q 78 58 72 42 Q 65 25 50 25 Z"
        fill="url(#strawG)" stroke="#880e4f" stroke-width="1.5"/>
  <!-- 高光 -->
  <ellipse cx="40" cy="42" rx="6" ry="10" fill="#ffffff" opacity="0.5" transform="rotate(-20 40 42)"/>
  <!-- 草莓籽 -->
  <g fill="#ffeb3b" opacity="0.9">
    <ellipse cx="38" cy="42" rx="1.5" ry="1"/>
    <ellipse cx="48" cy="38" rx="1.5" ry="1"/>
    <ellipse cx="58" cy="42" rx="1.5" ry="1"/>
    <ellipse cx="42" cy="55" rx="1.5" ry="1"/>
    <ellipse cx="52" cy="52" rx="1.5" ry="1"/>
    <ellipse cx="62" cy="58" rx="1.5" ry="1"/>
    <ellipse cx="46" cy="68" rx="1.5" ry="1"/>
    <ellipse cx="56" cy="72" rx="1.5" ry="1"/>
    <ellipse cx="50" cy="80" rx="1.5" ry="1"/>
  </g>
  <!-- 顶部叶 -->
  <g>
    <ellipse cx="35" cy="22" rx="10" ry="4" fill="url(#leafG)" transform="rotate(-15 35 22)"/>
    <ellipse cx="50" cy="18" rx="12" ry="5" fill="url(#leafG)"/>
    <ellipse cx="65" cy="22" rx="10" ry="4" fill="url(#leafG)" transform="rotate(15 65 22)"/>
    <rect x="48" y="15" width="4" height="10" fill="#388e3c" rx="1"/>
  </g>
</svg>