<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>番茄·手绘风</title>
  <defs>
  <linearGradient id="tomG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ef5350"/>
    <stop offset="100%" stop-color="#b71c1c"/>
  </linearGradient>

  <linearGradient id="leafG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a5d6a7"/>
    <stop offset="100%" stop-color="#388e3c"/>
  </linearGradient>
  </defs>
  <ellipse cx="50" cy="92" rx="20" ry="3" fill="#000" opacity="0.2"/>
  <!-- 番茄主体（圆润球体） -->
  <circle cx="50" cy="58" r="28" fill="url(#tomG)" stroke="#b71c1c" stroke-width="1.5"/>
  <!-- 高光 -->
  <ellipse cx="40" cy="48" rx="8" ry="10" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="44" cy="55" rx="3" ry="5" fill="#ffffff" opacity="0.7"/>
  <!-- 蒂部叶 -->
  <g>
    <ellipse cx="40" cy="32" rx="6" ry="3" fill="url(#leafG)" transform="rotate(-20 40 32)"/>
    <ellipse cx="50" cy="28" rx="7" ry="4" fill="url(#leafG)"/>
    <ellipse cx="60" cy="32" rx="6" ry="3" fill="url(#leafG)" transform="rotate(20 60 32)"/>
  </g>
  <!-- 蒂部小梗 -->
  <rect x="48" y="25" width="4" height="8" fill="#388e3c" rx="1"/>
</svg>