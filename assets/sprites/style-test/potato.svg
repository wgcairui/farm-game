<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>土豆·手绘风</title>
  <defs>
  <linearGradient id="potG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d4b878"/>
    <stop offset="100%" stop-color="#8b5a2b"/>
  </linearGradient>

  <linearGradient id="potG2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a1887f"/>
    <stop offset="100%" stop-color="#5d4037"/>
  </linearGradient>
  </defs>
  <ellipse cx="50" cy="92" rx="22" ry="3" fill="#000" opacity="0.2"/>
  <!-- 土豆主体（不规则椭圆） -->
  <ellipse cx="38" cy="55" rx="18" ry="15" fill="url(#potG)" stroke="#5d4037" stroke-width="1.5"/>
  <ellipse cx="58" cy="58" rx="22" ry="18" fill="url(#potG2)" stroke="#5d4037" stroke-width="1.5"/>
  <ellipse cx="48" cy="68" rx="16" ry="11" fill="url(#potG)" stroke="#5d4037" stroke-width="1.5"/>
  <!-- 高光 -->
  <ellipse cx="42" cy="48" rx="6" ry="4" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="55" cy="52" rx="8" ry="5" fill="#ffffff" opacity="0.4"/>
  <!-- 芽眼 -->
  <circle cx="35" cy="58" r="2" fill="#3e2618" opacity="0.6"/>
  <circle cx="55" cy="65" r="2" fill="#3e2618" opacity="0.6"/>
  <circle cx="62" cy="55" r="1.5" fill="#3e2618" opacity="0.6"/>
  <!-- 顶部小芽 -->
  <ellipse cx="50" cy="35" rx="8" ry="4" fill="url(#leafG)" stroke="#388e3c" stroke-width="1" opacity="0.7"/>
</svg>