<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>草屋（参照物）</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="100%" stop-color="#d4b878"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d56e"/>
      <stop offset="100%" stop-color="#a47148"/>
    </linearGradient>
  </defs>
  <!-- 主体 -->
  <rect x="20" y="80" width="160" height="110" fill="url(#wall)" stroke="#8b5a2b" stroke-width="3"/>
  <!-- 屋顶 -->
  <polygon points="0,80 200,80 170,30 30,30" fill="url(#roof)" stroke="#8b5a2b" stroke-width="3"/>
  <!-- 屋顶纹理（茅草层） -->
  <g stroke="#a47148" stroke-width="1.5" opacity="0.7">
    <line x1="10" y1="80" x2="40" y2="32"/>
    <line x1="50" y1="80" x2="80" y2="32"/>
    <line x1="90" y1="80" x2="120" y2="32"/>
    <line x1="130" y1="80" x2="160" y2="32"/>
    <line x1="170" y1="80" x2="190" y2="40"/>
  </g>
  <!-- 门 -->
  <rect x="85" y="130" width="30" height="60" fill="#5d3a26" rx="3"/>
  <circle cx="110" cy="165" r="2" fill="#f0b400"/>
  <!-- 窗户 -->
  <rect x="35" y="100" width="30" height="30" fill="#7ec0e8" stroke="#8b5a2b" stroke-width="2"/>
  <line x1="50" y1="100" x2="50" y2="130" stroke="#8b5a2b" stroke-width="1.5"/>
  <line x1="35" y1="115" x2="65" y2="115" stroke="#8b5a2b" stroke-width="1.5"/>
  <rect x="135" y="100" width="30" height="30" fill="#7ec0e8" stroke="#8b5a2b" stroke-width="2"/>
  <line x1="150" y1="100" x2="150" y2="130" stroke="#8b5a2b" stroke-width="1.5"/>
  <line x1="135" y1="115" x2="165" y2="115" stroke="#8b5a2b" stroke-width="1.5"/>
  <!-- 烟囱 -->
  <rect x="140" y="20" width="20" height="35" fill="#8b5a2b"/>
  <rect x="138" y="18" width="24" height="6" fill="#5d3a26"/>
  <!-- 烟 -->
  <ellipse cx="150" cy="8" rx="10" ry="6" fill="#fff" opacity="0.8"/>
  <ellipse cx="158" cy="-2" rx="14" ry="7" fill="#fff" opacity="0.6"/>
  <ellipse cx="145" cy="-14" rx="18" ry="8" fill="#fff" opacity="0.4"/>
</svg>