<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>草屋·QQ 农场风 v2</title>

  <!-- 烟囱 -->
  <rect x="160" y="20" width="22" height="50" fill="#8d6e63" stroke="#3e2723" stroke-width="3"/>
  <ellipse cx="171" cy="20" rx="13" ry="5" fill="#5d4037" stroke="#3e2723" stroke-width="2"/>
  <!-- 烟 -->
  <circle cx="175" cy="8" r="9" fill="#ffffff" stroke="#3e2723" stroke-width="2.5"/>
  <circle cx="188" cy="0" r="11" fill="#ffffff" stroke="#3e2723" stroke-width="2.5"/>
  <circle cx="200" cy="-8" r="13" fill="#ffffff" stroke="#3e2723" stroke-width="2.5"/>

  <!-- 屋顶主体（大三角） -->
  <polygon points="10,110 120,30 230,110" fill="#d84315" stroke="#3e2723" stroke-width="3" stroke-linejoin="round"/>

  <!-- 茅草层（3 层弧线，制造厚度） -->
  <path d="M 10 110 Q 70 100 120 105 Q 170 100 230 110" fill="none" stroke="#3e2723" stroke-width="3"/>
  <path d="M 30 90 Q 80 80 120 85 Q 160 80 210 90" fill="none" stroke="#3e2723" stroke-width="2.5"/>
  <path d="M 55 65 Q 90 55 120 58 Q 150 55 185 65" fill="none" stroke="#3e2723" stroke-width="2.5"/>
  <path d="M 80 45 Q 100 38 120 40 Q 140 38 160 45" fill="none" stroke="#3e2723" stroke-width="2"/>
  <!-- 茅草纹理短线 -->
  <g stroke="#3e2723" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="35" y1="105" x2="35" y2="115"/>
    <line x1="60" y1="100" x2="60" y2="115"/>
    <line x1="90" y1="100" x2="90" y2="115"/>
    <line x1="120" y1="100" x2="120" y2="115"/>
    <line x1="150" y1="100" x2="150" y2="115"/>
    <line x1="180" y1="100" x2="180" y2="115"/>
    <line x1="205" y1="105" x2="205" y2="115"/>
  </g>

  <!-- 阁楼小窗（圆） -->
  <circle cx="120" cy="80" r="12" fill="#ffee58" stroke="#3e2723" stroke-width="3"/>
  <line x1="120" y1="68" x2="120" y2="92" stroke="#3e2723" stroke-width="2"/>
  <line x1="108" y1="80" x2="132" y2="80" stroke="#3e2723" stroke-width="2"/>

  <!-- 墙体 -->
  <rect x="30" y="110" width="180" height="115" fill="#fff8e1" stroke="#3e2723" stroke-width="3"/>
  <!-- 木纹 -->
  <line x1="70" y1="115" x2="70" y2="220" stroke="#a1887f" stroke-width="1.5"/>
  <line x1="110" y1="115" x2="110" y2="220" stroke="#a1887f" stroke-width="1.5"/>
  <line x1="170" y1="115" x2="170" y2="220" stroke="#a1887f" stroke-width="1.5"/>

  <!-- 左窗 -->
  <rect x="48" y="135" width="42" height="42" fill="#81d4fa" stroke="#3e2723" stroke-width="3"/>
  <line x1="69" y1="135" x2="69" y2="177" stroke="#3e2723" stroke-width="2.5"/>
  <line x1="48" y1="156" x2="90" y2="156" stroke="#3e2723" stroke-width="2.5"/>
  <!-- 窗台（花） -->
  <rect x="44" y="175" width="50" height="8" fill="#5d4037" stroke="#3e2723" stroke-width="2"/>
  <circle cx="56" cy="170" r="4" fill="#e53935" stroke="#3e2723" stroke-width="2"/>
  <circle cx="82" cy="170" r="4" fill="#fdd835" stroke="#3e2723" stroke-width="2"/>

  <!-- 右窗 -->
  <rect x="150" y="135" width="42" height="42" fill="#81d4fa" stroke="#3e2723" stroke-width="3"/>
  <line x1="171" y1="135" x2="171" y2="177" stroke="#3e2723" stroke-width="2.5"/>
  <line x1="150" y1="156" x2="192" y2="156" stroke="#3e2723" stroke-width="2.5"/>
  <rect x="146" y="175" width="50" height="8" fill="#5d4037" stroke="#3e2723" stroke-width="2"/>
  <circle cx="158" cy="170" r="4" fill="#ec407a" stroke="#3e2723" stroke-width="2"/>
  <circle cx="184" cy="170" r="4" fill="#e53935" stroke="#3e2723" stroke-width="2"/>

  <!-- 门 -->
  <rect x="98" y="155" width="44" height="70" fill="#5d4037" stroke="#3e2723" stroke-width="3"/>
  <circle cx="130" cy="195" r="3" fill="#fdd835" stroke="#3e2723" stroke-width="1.5"/>
  <path d="M 120 160 L 120 220" stroke="#212121" stroke-width="1.5" opacity="0.5"/>

  <!-- 底部草地 -->
  <ellipse cx="120" cy="232" rx="110" ry="6" fill="#7cb342" stroke="#3e2723" stroke-width="2"/>
</svg>