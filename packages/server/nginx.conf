# farm-game-server — local debug reverse proxy + wechatgame static serving.
#
# Wires three workloads behind one port (8080 by default):
#   /api/*    → Fastify HTTP API on host:3000  (auth/wechat, player/info, crop/configs, farm/*)
#   /ws       → Colyseus WS on host:2567      (farm room — matchmake + state push)
#   /         → build/wechatgame/ static      (so http://localhost:8080/ can serve the game files)
#
# Backend services (Fastify HTTP / Colyseus WS) intentionally stay on host: the dev
# loop is `pnpm --filter @farm-game/server dev` + `dev:ws` with hot-reload. Putting
# nginx in front lets the team hit a single 127.0.0.1:8080 from curl / the WeChat
# devtools "urlCheck=false" patch, without caring which port is which.
#
# On Docker Desktop the nginx container reaches host:3000 / host:2567 via
# `host.docker.internal`, which Docker adds to /etc/hosts when the service is
# declared with `extra_hosts`. If you switch to Linux Docker or Podman you may
# need `network_mode: host` or a different gateway IP — adjust then.

# Image is the official nginx:alpine. Default mime.types + autoindex off are fine.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events { worker_connections 256; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 30;
  client_max_body_size 4m; # match WeChat release 4MB upload cap
  access_log    /tmp/nginx-access.log;

  # Compressed responses — wechatgame is heavy (10MB+ debug build).
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             application/wasm image/svg+xml;

  upstream fastapi { server host.docker.internal:3000; keepalive 8; }
  upstream colyseus { server host.docker.internal:2567; keepalive 8; }

  server {
    listen 8080;
    server_name _;

    # ── Fastify HTTP API ────────────────────────────────────────────
    location /api/ {
      proxy_pass http://fastapi/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # WeChat devtools POSTs JSON without size warnings; bound generously.
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # ── Colyseus WS upgrade ─────────────────────────────────────────
    location /ws {
      proxy_pass http://colyseus;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s; # long-lived rooms
    }

    # ── Built wechatgame dir (mounted from host) ────────────────────
    # When the team runs `pnpm --filter @farm-game/client-mini build:cocos`
    # followed by `node scripts/patch-wechat-build.mjs`, the dir at
    # ../client-mini/build/wechatgame is ready to serve. http://localhost:8080/
    # then lists game.json, cocos-js/, assets/ — useful for inspecting a
    # non-devtools load.
    location / {
      root /wechatgame;
      index game.json;
      try_files $uri $uri/ /game.json;
    }
  }
}