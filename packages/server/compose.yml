# Local debug stack: PostgreSQL + Redis + nginx reverse proxy.
#
# Per ADR-0003 D30: G1 integration tests must run against a real PostgreSQL,
# never against an in-memory stub. This compose file is the single source of
# truth for the dev/test database — never share it with production data.
#
# G2 T2 adds Redis for the Colyseus matchmaker directory + presence. Redis
# is ephemeral by design — no volume, no business state.
#
# Nginx (M5-fix 2026-09-14): one-port front for the team to hit during debug.
# /api/* → Fastify (host:3000), /ws → Colyseus (host:2567), / → static
# wechatgame dir. The Fastify + Colyseus processes themselves run on host via
# `pnpm dev` / `pnpm dev:ws` (we keep them out of the container so hot-reload
# stays instant). nginx reaches them via `host.docker.internal` (Docker Desktop
# adds it automatically when `extra_hosts: host.docker.internal:host-gateway`
# is declared — switch to network_mode: host on Linux if you don't get that).
#
# Usage:
#   pnpm --filter @farm-game/server db:up       # start postgres + redis + nginx (loopback only)
#   pnpm --filter @farm-game/server db:down     # stop and remove the containers
#   pnpm --filter @farm-game/server db:reset    # drop+create the volume (postgres data gone)
#   pnpm --filter @farm-game/server db:migrate  # apply SQL migrations
#   curl -s http://127.0.0.1:8080/api/healthz   # smoke-test the stack via nginx

name: farm-game-server

services:
  postgres:
    image: postgres:16-alpine
    container_name: farm-game-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farm}
      POSTGRES_DB: ${POSTGRES_DB:-farm_game}
    ports:
      # Bind to loopback only — never expose to the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - farm-pg-data:/var/lib/postgresql/data
      # Bootstrap script: create the integration test database on first run.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farm} -d ${POSTGRES_DB:-farm_game}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: farm-game-redis
    restart: unless-stopped
    ports:
      # Bind to loopback only — never expose to the LAN. Host side uses 6380:
      # 6379 is routinely occupied by other local projects / port forwards.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: farm-game-nginx
    restart: unless-stopped
    # Bind only to loopback so the team can debug locally without exposing
    # the API/WS ports to the LAN (runbook §11.3 already covers wechatgame's
    # own urlCheck issue; nginx is here for non-wechatgame consumers like curl
    # scripts and the Colyseus SDK running in unit tests).
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount the Cocos-built wechatgame dir as the static root. Until the
      # team runs `pnpm --filter @farm-game/client-mini build:cocos` + the
      # patch script, this dir may be empty or stale — nginx will still
      # answer /api/* and /ws fine.
      - ../client-mini/build/wechatgame:/wechatgame:ro
    # host.docker.internal is added to /etc/hosts by the Docker engine on
    # macOS / Windows; on Linux without that magic, switch to
    # `network_mode: host` and remove the upstream `host.docker.internal`
    # hostnames (use 127.0.0.1 directly).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  farm-pg-data:
    name: farm-pg-data
